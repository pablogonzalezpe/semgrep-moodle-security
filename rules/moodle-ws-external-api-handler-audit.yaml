rules:
  - id: moodle-ws-external-api-handler-audit
    patterns:
      - pattern-either:
          - pattern: |
              class $CLS extends external_api {
                ...
              }
          - pattern: |
              class $CLS extends \core_external\external_api {
                ...
              }
          - pattern: |
              class $CLS extends \external_api {
                ...
              }
    message: >-
      This class is a Moodle web service handler (extends external_api).
      Every public static method registered via db/services.php on a
      class that extends external_api must call self::validate_context()
      on each user-controlled context and require_capability() for every
      mutation or cross-context read. Omitting these is the root cause
      of capability-bypass and IDOR issues on web services, regardless
      of whether the handler method is named execute() (modern Moodle)
      or named after the service (legacy pre-3.1 pattern).
    paths:
      include:
        - '**/*.php'
      exclude:
        - '**/vendor/**'
        - '**/node_modules/**'
        - '**/tests/**'
        - '**/*_test.php'
        - '**/behat/**'
        - '**/phpunit/**'
    languages:
      - php
    severity: WARNING
    metadata:
      category: security
      confidence: LOW
      likelihood: MEDIUM
      impact: HIGH
      subcategory:
        - audit
      technology:
        - Moodle Plugins
      vulnerability_class:
        - Improper Authorization
      references:
        - https://moodledev.io/docs/apis/subsystems/external/writing-a-service
        - https://moodledev.io/docs/apis/subsystems/access
      owasp:
        - A01:2021 - Broken Access Control
      cwe:
        - "CWE-862: Missing Authorization"
        - "CWE-639: Authorization Bypass Through User-Controlled Key"
