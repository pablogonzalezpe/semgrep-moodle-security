rules:
  - id: moodle-sql-injection-get-records-sql-concat-audit
    patterns:
      - pattern-either:
          - pattern: $DB->get_records_sql($A . $B, ...)
          - pattern: $DB->get_record_sql($A . $B, ...)
          - pattern: $DB->get_fieldset_sql($A . $B, ...)
          - pattern: $DB->count_records_sql($A . $B, ...)
          - pattern: $DB->get_records_sql($A . $B)
          - pattern: $DB->get_record_sql($A . $B)
          - pattern: $DB->get_fieldset_sql($A . $B)
          - pattern: $DB->count_records_sql($A . $B)
    message: >-
      $DB->get_records_sql (or sibling SQL method) first argument is
      built with string concatenation. Any concatenated fragment that
      originates in request input is a SQL-injection sink; the Moodle
      DML API requires placeholders + a $params array.
    paths:
      include:
        - '**/*.php'
      exclude:
        - '**/vendor/**'
        - '**/node_modules/**'
        - '**/tests/**'
        - '**/*_test.php'
        - '**/behat/**'
        - '**/phpunit/**'
    languages:
      - php
    severity: WARNING
    metadata:
      category: security
      confidence: LOW
      likelihood: MEDIUM
      impact: HIGH
      subcategory:
        - audit
      technology:
        - Moodle Plugins
      vulnerability_class:
        - SQL Injection
      references:
        - https://moodledev.io/docs/apis/core/dml
      owasp:
        - A03:2021 - Injection
      cwe:
        - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
